name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Build contracts (WASM target)
        run: |
          cargo fmt
          cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts
      - name: Run contract tests
        run: cargo test --workspace
        working-directory: contracts

  test-sdk:
    name: SDK Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Run SDK tests
        run: pnpm --filter @lineproof/sdk test

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build SDK (backend imports @lineproof/sdk)
        run: pnpm --filter @lineproof/sdk build
      - name: Run backend tests
        run: pnpm --filter @lineproof/backend test

  test-integration:
    name: SDK Integration Tests
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-integration-tests]')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-integration-tests')) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build contracts (WASM target)
        run: |
          cargo build --target wasm32-unknown-unknown --release
        working-directory: contracts
      - name: Start Docker Compose stack
        run: docker compose -f docker/docker-compose.yml up -d
      - name: Wait for Soroban RPC to be ready
        run: |
          echo "Waiting for Soroban RPC to be ready..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/health; do sleep 2; done'
          echo "Soroban RPC is ready"
      - name: Build SDK
        run: pnpm --filter @lineproof/sdk build
      - name: Run integration tests
        run: pnpm --filter @lineproof/sdk test:integration
        env:
          SOROBAN_RPC_URL: http://localhost:8080
          NETWORK_PASSPHRASE: Standalone Network ; February 2017
          FRIENDBOT_URL: http://localhost:8000/friendbot
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
